[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hidden-py"
version = "1.3.0"
description = "A python package for discrete-output hidden Markov models"
readme = "README.md"
requires-python = "==3.10.17"
dependencies = [
    "loguru>=0.7.3",
    "matplotlib>=3.10.9",
    "numba>=0.65.1",
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
  "pytest>=9.1.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["hidden_py*"]


